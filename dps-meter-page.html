     секцию <style> можно выбросить, классы оставить как семантику.

  4. Переводы лежат в объекте `i18n` в конце файла.
     Добавить язык = добавить ключ в i18n и кнопку в .lang-bar.

    /* ── Reset & tokens ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --surface2: #1e2030;

      --accent2:  #e07820;
      --text:     #e4e6f0;
      --muted:    #8890a8;
      --border:   #2a2d3e;
      --radius:   12px;
      --max:      1080px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { display: block; max-width: 100%; }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
    .section { padding: 64px 0; }
    .section--alt { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .lang-bar { display: flex; justify-content: flex-end; padding: 12px 24px; gap: 8px; border-bottom: 1px solid var(--border); }

    .lang-btn:hover, .lang-btn.active { background: var(--accent); color: #0d0e14; border-color: var(--accent); font-weight: 700; }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 80px 24px 64px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(240,168,64,.13) 0%, transparent 70%);
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: 16px; }
    .hero h1 em { color: var(--accent); font-style: normal; }
    .hero p { font-size: 1.1rem; color: var(--muted); max-width: 560px; margin: 0 auto 36px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .15s; text-decoration: none !important; }

    .btn-dl  { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0d0e14; }
    .btn-sec { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-left: 10px; }
    .hero-note { margin-top: 18px; font-size: .82rem; color: var(--muted); }

    /* ── Features ── */
    .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .feat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; transition: border-color .2s; }
    .feat:hover { border-color: var(--accent); }
    .feat-icon { font-size: 1.8rem; margin-bottom: 12px; }
    .feat h3 { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
    .feat p  { font-size: .9rem; color: var(--muted); }

    /* ── Screenshots ── */
    .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .shot { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); transition: border-color .2s; cursor: zoom-in; }
    .shot:hover { border-color: var(--accent); }
    .shot img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .shot-label { padding: 10px 14px; font-size: .88rem; color: var(--muted); background: var(--surface); }

    /* ── Lightbox ── */
    #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 999; align-items: center; justify-content: center; cursor: zoom-out; }
    #lb.open { display: flex; }
    #lb img { max-width: 92vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,.8); }

    /* ── Install steps ── */
    .steps { display: flex; flex-direction: column; gap: 18px; max-width: 600px; margin: 0 auto; }
    .step { display: flex; gap: 18px; align-items: flex-start; }
    .step-n { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #0d0e14; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .step-body { font-size: .95rem; color: var(--muted); }
    .step-body strong { color: var(--text); }

    /* ── Bugs ── */
    .bug-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .bug-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s; }
    .bug-card:hover { border-color: var(--accent); }
    .bug-card-icon { font-size: 1.6rem; }
    .bug-card h3 { font-size: 1rem; font-weight: 700; }
    .bug-card p  { font-size: .88rem; color: var(--muted); flex: 1; }
    .bug-card a  { display: inline-block; margin-top: 6px; font-size: .9rem; font-weight: 600; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .btn { padding: 12px 20px; font-size: .9rem; }
      .btn-sec { margin-left: 0; margin-top: 10px; }
      .hero { padding: 60px 16px 48px; }
    }

/* ── Engine ── */
let currentLang = 'ru';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.getAttribute('onclick').includes("'" + lang + "'"))
  );
  document.querySelectorAll('.i18n').forEach(el => {
    const key = el.dataset.key;
    const val = i18n[lang]?.[key];
    if (val !== undefined) el.innerHTML = val;
  });
  document.documentElement.lang = lang === 'ko' ? 'ko' : lang === 'en' ? 'en' : 'ru';
}

function openLb(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lb').classList.add('open');
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

// init
setLang('ru');
